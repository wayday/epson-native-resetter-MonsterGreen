name: epson_waste_ink_resetter
description: "Aplikasi Native Flutter untuk Reset Waste Ink Pad Printer Epson (AdjProg Mobile & Desktop) via USB OTG & libusb"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter
  # Library USB cross-platform (Android USB Host API & Desktop Win/Linux libusb)
  quick_usb: ^0.4.3
  # Library libusb native C-binding langsung via Dart FFI
  flutter_libusb: ^0.1.0
  # Icon dan styling modern
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
